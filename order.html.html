<!DOCTYPE html>
<html>
<head>
<title>Place Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f6fb;text-align:center}
input,textarea{width:90%;max-width:300px;padding:10px;margin:8px}
button{padding:12px 25px;background:#0d47a1;color:white;border:none;border-radius:5px}
</style>
</head>
<body>

<h2>🛒 Place Your Order</h2>

<form onsubmit="sendOrder(event)">
<input id="name" placeholder="Your Name" required>
<input id="phone" placeholder="Phone Number" required>
<textarea id="address" placeholder="Delivery Address"></textarea>
<textarea id="product" placeholder="Product & Quantity"></textarea>
<button>Send Order</button>
</form>

<script>
function sendOrder(e){
e.preventDefault();
let msg=`New Order:
Name: ${name.value}
Phone: ${phone.value}
Address: ${address.value}
Product: ${product.value}`;
window.open("https://wa.me/918739977959?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
