<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Add Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f6fb;text-align:center}
.card{background:white;margin:20px;padding:15px;border-radius:8px;max-width:400px;margin:auto}
input{width:100%;padding:10px;margin:8px;border-radius:5px;border:1px solid #ccc}
button{padding:12px;background:#0d47a1;color:white;border:none;border-radius:6px;width:100%}
</style>
</head>
<body>

<div class="card">
<h2>🛠 Product Upload Panel</h2>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="rating" placeholder="Rating (1 - 5)">
<input id="image" placeholder="Image Link">

<button onclick="addProduct()">Add Product</button>

<p id="msg"></p>
</div>

<script>
const API="PASTE_API_LINK_HERE";

function addProduct(){
fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
data:[{
name:name.value,
price:price.value,
rating:rating.value,
image:image.value
}]
})
})
.then(r=>r.json())
.then(d=>{
msg.innerHTML="✅ Product Added Successfully";
name.value="";
price.value="";
rating.value="";
image.value="";
})
.catch(()=>msg.innerHTML="❌ Error adding product");
}
</script>

</body>
</html>
